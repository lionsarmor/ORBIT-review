</style></head><body><header>ORBIT / THE SATURN SOCIETY</header><button id="count" aria-label="Count together">0</button><aside>One browser. Your whole lounge.<br>Try clicking the counter from another device.</aside><label for="notes">A NOTE FROM THE CREW</label><input id="notes" autocomplete="off" placeholder="Say hello from your little planet"><h1>A little test flight.</h1><p>Everyone sees the same page, the same clicks,<br>the same little adventure.<br>Hosted by one of your people.</p><div class="planet" aria-hidden="true"></div><small>THIS PAGE SAVES NOTHING · ENJOY THE VIEW</small><script>
